<div id="boot-loader" aria-label="Portfolio loading">
  <div class="boot-spinner" aria-hidden="true"></div>
  <p id="boot-message" role="status" aria-live="polite">Loading portfolio…</p>
  <button id="boot-retry" type="button" hidden>Retry</button>
</div>
<noscript><style>#boot-loader{display:none}</style><p class="boot-noscript">Please enable JavaScript to view this portfolio. You can also reach me at <a href="mailto:mr.khahani@gmail.com">mr.khahani@gmail.com</a>.</p></noscript>
<div id="root"></div>
<script>
(() => {
  const loader = document.getElementById('boot-loader');
  const message = document.getElementById('boot-message');
  const retry = document.getElementById('boot-retry');
  const styles = [...document.querySelectorAll('[data-app-style]')];
  const appScript = document.querySelector('script[src*="/static/js/main."]');
  let finished = false;
  function offerRetry(text) {
    if (finished) return;
    message.textContent = text;
    retry.hidden = false;
  }
  function checkReady() {
    if (finished || !document.querySelector('#greeting') ||
        !styles.every(link => link.media === 'all')) return;
    finished = true;
    clearTimeout(timeout);
    observer.disconnect();
    window.removeEventListener('error', onResourceError, true);
    styles.forEach(link => link.removeEventListener('load', checkReady));
    loader.remove();
  }
  function onResourceError(event) {
    if (event.target === appScript || styles.includes(event.target)) {
      offerRetry('The portfolio couldn’t load. Check your connection and try again.');
    }
  }
  retry.addEventListener('click', () => window.location.reload());
  window.addEventListener('error', onResourceError, true);
  styles.forEach(link => link.addEventListener('load', checkReady));
  const observer = new MutationObserver(checkReady);
  observer.observe(document.getElementById('root'), {childList: true, subtree: true});
  const timeout = setTimeout(() => offerRetry(
    'Loading is taking longer than usual. You can keep waiting or retry.'
  ), 12000);
  // Load errors can occur before this inline script is reached.
  if (appScript.dataset.failed === 'true' || styles.some(link => link.dataset.failed === 'true')) {
    offerRetry('The portfolio couldn’t load. Check your connection and try again.');
  }
  checkReady();
})();
</script>
